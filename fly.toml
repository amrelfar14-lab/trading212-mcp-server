# fly.toml app configuration file generated for trading212-mcp-server on 2026-10-23T13:23:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trading212-mcp-server'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TRANSPORT = 'streamable-http'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
